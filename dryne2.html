      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #f6f5fd;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        font-family: "Nunito Sans", system-ui, sans-serif;
        color: #2a2840;
      }
      main {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
      }
      .coin {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 0 #e3e1fa;
        margin-bottom: 10px;
        animation: beat 1.6s ease-in-out infinite;
      }
      h1 {
        margin: 0;
        font-family: "Fredoka", system-ui, sans-serif;
        font-weight: 700;
        font-size: 40px;
        line-height: 1.05;
      }
      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.45;
        color: #5b5873;
      }
      .play {
        margin-top: 18px;
        width: 100%;
        height: 56px;
        border-radius: 18px;
        background: #ec3f7c;
        color: #fff;
        font-family: "Fredoka", system-ui, sans-serif;
        font-weight: 600;
        font-size: 19px;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 5px 0 #b8245a;
      }
      .play:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #b8245a;
      }
      .play:focus-visible {
        outline: 3px solid #5646d8;
        outline-offset: 3px;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.08);
        }
        30% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .coin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="coin" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 24 24">
          <path

          />
        </svg>
      </div>
      <h1>Nosso jogo</h1>
      <a class="play" href="https://nosso-jogo-d8lk.onrender.com/?k=01082026"
        >Jogar ❤</a
      >
    </main>
  </body>
</html>
